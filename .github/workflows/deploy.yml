name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Inject Telegram secrets
        run: |
          if [ -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "⚠️ Warning: BOT_TOKEN secret is not set"
          fi
          if [ -z "${{ secrets.CHAT_ID }}" ]; then
            echo "⚠️ Warning: CHAT_ID secret is not set"
          fi
          
          sed -i "s/__BOT_TOKEN__/${{ secrets.BOT_TOKEN }}/g" index.template.html
          sed -i "s/__CHAT_ID__/${{ secrets.CHAT_ID }}/g" index.template.html
          mv index.template.html index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
